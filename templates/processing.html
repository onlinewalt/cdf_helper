<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 智能填写中 - CDF Helper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>CDF Helper · 报关清单生成器</h1>
            <p class="subtitle">AI 智能填写进度</p>
        </header>

        <div class="card">
            <div class="spinner"></div>
            <h2>正在调用 AI 估算备件的重量 / 单价，请稍候…</h2>
            <p>共 <strong>{{ missing }}</strong> 条备件缺少 重量/单价，预计约 <strong>{{ estimated }}</strong> 秒。
                请勿关闭或刷新此页面，完成后会自动跳转。</p>

            <div class="ai-log" id="ai-log">
                <p class="muted">准备中…</p>
            </div>

            <p class="error hidden" id="ai-error"></p>

            <div class="actions">
                <a class="btn" href="{{ url_for('index') }}">返回重新选择</a>
            </div>
        </div>
    </div>

    <style>
        .spinner {
            width: 36px; height: 36px; margin: 12px auto;
            border: 4px solid #ddd; border-top-color: #2f6fed;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .ai-log { background: #f7f8fa; border: 1px solid #e3e6ec; border-radius: 6px;
                  padding: 10px 14px; margin: 16px 0; font-size: 13px; text-align: left; }
        .ai-log p { margin: 2px 0; }
        .hidden { display: none; }
        .error { color: #c0392b; }
    </style>

    <script>
        const taskId = "{{ task_id }}";
        const poll = setInterval(async () => {
            try {
                const resp = await fetch(`/status/${taskId}`);
                if (!resp.ok) { throw new Error('HTTP ' + resp.status); }
                const data = await resp.json();

                const box = document.getElementById('ai-log');
                if (data.log && data.log.length) {
                    box.innerHTML = data.log.map(m => `<p>${m}</p>`).join('');
                    box.scrollTop = box.scrollHeight;
                }

                if (data.status === 'done' && data.result_url) {
                    clearInterval(poll);
                    window.location.href = data.result_url;
                } else if (data.status === 'error') {
                    clearInterval(poll);
                    document.querySelector('.spinner').style.display = 'none';
                    const err = document.getElementById('ai-error');
                    err.textContent = 'AI 调用失败：' + (data.error || '未知错误');
                    err.classList.remove('hidden');
                }
            } catch (e) {
                clearInterval(poll);
                const err = document.getElementById('ai-error');
                err.textContent = '连接中断，无法获取进度。请返回重试。';
                err.classList.remove('hidden');
            }
        }, 1500);
    </script>
</body>
</html>
