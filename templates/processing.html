<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 智能填写中 - CDF Helper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <h1>CDF Helper · 报关清单生成器</h1>
        <p class="subtitle">AI 智能填写进度</p>
    </header>

    <main>
        <div class="card">

            <!-- Cohere HP: dark-product-band processing hero -->
            <div class="processing-hero">
                <h2>正在估算备件的重量 / 单价，请稍候…</h2>
                <p>共 <strong>{{ missing }}</strong> 条备件缺少 重量/单价，预计约 <strong>{{ estimated }}</strong> 秒。</p>
                <p style="opacity:0.8;margin-top:var(--space-sm);">请勿关闭或刷新此页面，完成后会自动跳转。</p>
            </div>

            <div class="ai-log" id="ai-log">
                <p class="muted">准备中…</p>
            </div>

            <p class="error-msg hidden" id="ai-error"></p>

            <div class="actions">
                <a class="btn btn-ghost" href="{{ url_for('index') }}">返回重新选择</a>
            </div>

        </div>
    </main>

    <script>
        const taskId = "{{ task_id }}";
        const poll = setInterval(async () => {
            try {
                const resp = await fetch(`/status/${taskId}`);
                if (!resp.ok) { throw new Error('HTTP ' + resp.status); }
                const data = await resp.json();

                const box = document.getElementById('ai-log');
                if (data.log && data.log.length) {
                    box.innerHTML = data.log.map(m => `<p>${m}</p>`).join('');
                    box.scrollTop = box.scrollHeight;
                }

                if (data.status === 'done' && data.result_url) {
                    clearInterval(poll);
                    window.location.href = data.result_url;
                } else if (data.status === 'error') {
                    clearInterval(poll);
                    document.querySelector('.processing-hero').style.display = 'none';
                    const err = document.getElementById('ai-error');
                    err.textContent = 'AI 调用失败：' + (data.error || '未知错误');
                    err.classList.remove('hidden');
                }
            } catch (e) {
                clearInterval(poll);
                const err = document.getElementById('ai-error');
                err.textContent = '连接中断，无法获取进度。请返回重试。';
                err.classList.remove('hidden');
            }
        }, 1500);
    </script>
</body>
</html>
