name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff, pyflakes gate)
        run: ruff check .
      - name: Type-check (mypy --strict, non-blocking)
        continue-on-error: true
        run: mypy --strict --ignore-missing-imports cdf_helper
      - name: Tests with coverage
        run: pytest --cov=cdf_helper --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # Mutation testing — non-blocking; surfaces surviving mutants for follow-up
  # without failing PRs. Mutmut mutates only covered lines (see pyproject).
  # Note: mutmut does not run on native Windows; the ubuntu job is where it executes.
  mutation:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: mutmut run
      - run: mutmut results
